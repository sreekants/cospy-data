packages:
  modules:  # Local jurisdictional rule set, generated by .claude/skills/mapgen/legata_site.py (MAPGEN §4.3)
     - name: Istanbul.TSS
       module: maritime.regulation.internal.ZoneRule
       config: sample.frequency=1 types=TRAFFIC_SEPARATION_SCHEME,SEPARATION_ZONE automata=$(SIMULATION)/rule/tss.legata scorecard=$(SIMULATION)/rule/tss.score.yaml zonekey=Istanbul.TSS

     # Hand-written modules of the legacy Istanbul map, kept with their own rule/score.yaml. They do not load: that scorecard names
     # concerns (e.g. "berthing risk") that config/examiner/zones.yaml does not map; they did not load before the regeneration either
     - name: Istanbul.Turkeli.Zone
       module: maritime.regulation.internal.WaterwayRule
       config: sample.frequency=1 automata=$(SIMULATION)/rule/turkeli.legata scorecard=$(SIMULATION)/rule/score.yaml zonekey=Turkeli

     - name: Istanbul.Marmara.Zone
       module: maritime.regulation.internal.WaterwayRule
       config: sample.frequency=1 automata=$(SIMULATION)/rule/marmara.legata scorecard=$(SIMULATION)/rule/score.yaml zonekey=Marmara

     - name: Istanbul.Bosphorus.Zone
       module: maritime.regulation.inland.InshoreTrafficRule
       config: sample.frequency=1 automata=$(SIMULATION)/rule/bosphorus.legata scorecard=$(SIMULATION)/rule/score.yaml zonekey=Bosphorus
