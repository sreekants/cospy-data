packages:
  modules:  # Local jurisdictional rule set, generated by .claude/skills/mapgen/legata_site.py (MAPGEN §4.3)
     - name: Copenhagen.TSS
       module: maritime.regulation.internal.ZoneRule
       config: sample.frequency=1 types=TRAFFIC_SEPARATION_SCHEME,SEPARATION_ZONE automata=$(SIMULATION)/rule/tss.legata scorecard=$(SIMULATION)/rule/score.yaml zonekey=Copenhagen.TSS

     - name: Copenhagen.Zones
       module: maritime.regulation.internal.ZoneRule
       config: sample.frequency=1 types=ANCHORAGE,AREA_TO_AVOID,HARBOUR,MILITARY_AREA,NATURE_RESERVE,PRECAUTIONARY_AREA,WATERWAY automata=$(SIMULATION)/rule/zones.legata scorecard=$(SIMULATION)/rule/score.yaml zonekey=Copenhagen.*

