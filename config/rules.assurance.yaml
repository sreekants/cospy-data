packages:
  modules:  # Assurance modules
     # Inspectors are higher-level faculties under /Faculty/Practice/Inspectors.
     # PracticeEvaluator drives them after the examiners in each pass and pumps
     # their IPC topics; examiners report to them by message. A 'scorecard'
     # argument loads a scorecard of the inspector's own.
     #
     # The TestInspector conducts the test run. At startup it selects the
     # vessels under test (REQ.024), usually one. Situations are evaluated with
     # these on the own-ship side of each encounter, and the fact tables listed
     # in the file keep only their rows. No file, or an empty list: every vessel.
     - name: TestInspector
       module: rules.assurance.inspection.TestInspector
       config: file=$(SIMULATION)/undertest.yaml

     # The ViolationInspector is the clearing house for violation costs. COLREG rules,
     # territorial rules and examiners price and debounce their own findings, then
     # post them to /Faculty/Practice/Inspectors/ViolationInspector; this inspector
     # alone writes Ro, Rl (penalty) and Rw (weight) into fact_concern. Without it,
     # violations are posted but never recorded, and the run log says so.
     # Rule failures themselves are logged by the rules, every failure priced or not:
     # COLREG RuleNN to fact_colreg_rNN, territorial rules to fact_territorial.
     - name: ViolationInspector
       module: rules.assurance.inspection.ViolationInspector
